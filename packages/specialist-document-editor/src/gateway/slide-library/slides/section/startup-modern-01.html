<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#0b0d1a;--ink:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;
  font-family:'Inter','SF Pro Display',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-columns:1fr 2fr;
  background-image:radial-gradient(ellipse 80% 80% at 0% 100%,rgba(34,211,238,.35),transparent 60%);
}
.left{padding:7cqmin;display:flex;flex-direction:column;justify-content:center;gap:3cqmin}
.chip{display:inline-flex;align-items:center;gap:1cqmin;padding:.7cqmin 1.6cqmin;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);border-radius:100px;font-size:1.25cqmin;letter-spacing:.2em;text-transform:uppercase;color:#a5f3fc;width:fit-content}
.num{font-size:16cqmin;line-height:.85;font-weight:800;letter-spacing:-.06em;background:linear-gradient(180deg,#22d3ee,#0891b2);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:1.4cqmin;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.right{padding:7cqmin 7cqmin 7cqmin 0;display:flex;flex-direction:column;justify-content:center;gap:3cqmin}
h2{font-size:9cqmin;line-height:1;font-weight:700;letter-spacing:-.03em;max-width:18ch}
.deck{font-size:2.1cqmin;line-height:1.55;color:var(--muted);max-width:45ch}
.hr{width:6cqmin;height:2px;background:var(--accent);border-radius:2px}
</style></head><body>
<div class="left">
  <span class="chip">Chapter Three</span>
  <span class="num">03</span>
  <span class="label">The Product</span>
</div>
<div class="right">
  <div class="hr"></div>
  <h2>How the gateway actually works.</h2>
  <p class="deck">A short tour under the hood — from the moment a request lands to the point your agent is running inside its own sandbox, with its own database, in its own process.</p>
</div>
</body></html>
