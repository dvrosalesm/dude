<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#c5d7ff;--chrome1:#e8e8e8;--chrome2:#8a8a8a;--accent:#ff2a68;--lime:#c6ff00;--cyan:#1affff;--ink:#1a1a4a;
  font-family:'Arial Black','Impact','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:0;
  background-image:
    radial-gradient(ellipse 50% 30% at 30% 20%,rgba(26,255,255,.4),transparent 55%),
    radial-gradient(ellipse 50% 30% at 70% 80%,rgba(255,42,104,.3),transparent 55%),
    linear-gradient(180deg,#c5d7ff 0%,#e8d5ff 50%,#ffd5e8 100%);
}
.winbar{background:linear-gradient(180deg,#c4c4f0 0%,#8888cc 100%);border-bottom:.3cqmin solid #4a4a8a;padding:1.4cqmin 2cqmin;display:flex;align-items:center;gap:1.5cqmin;font-size:2cqmin;font-weight:700;color:#fff;text-shadow:1px 1px 0 #4a4a8a}
.winbar .ico{width:3cqmin;height:3cqmin;background:linear-gradient(135deg,#ff2a68,#c6ff00);border:.2cqmin solid #fff;border-radius:.5cqmin}
.winbar .title{flex:1;letter-spacing:.05em}
.winbar .btns{display:flex;gap:.5cqmin}
.winbar .btn{width:4cqmin;height:3cqmin;background:linear-gradient(180deg,#d8d8d8,#a0a0a0);border:.2cqmin solid #4a4a4a;border-radius:.3cqmin;display:flex;align-items:center;justify-content:center;font-size:1.6cqmin;color:#000}
.main{padding:4cqmin;display:flex;flex-direction:column;justify-content:center;gap:3cqmin;position:relative}
.sparkle{position:absolute;font-size:5cqmin;color:#ff2a68;filter:drop-shadow(0 0 8px rgba(255,42,104,.6))}
.sparkle.s1{top:2cqmin;right:10cqmin;transform:rotate(-15deg);color:var(--cyan)}
.sparkle.s2{bottom:20cqmin;left:4cqmin;color:var(--lime);transform:rotate(20deg)}
.sparkle.s3{top:40cqmin;right:4cqmin;color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:1.2cqmin;padding:1.6cqmin 3cqmin;background:linear-gradient(180deg,#fff 0%,#e0e0e0 50%,#b0b0b0 100%);border:.3cqmin solid #000;border-radius:100px;font-size:2.2cqmin;font-weight:900;letter-spacing:.1em;text-transform:uppercase;width:fit-content;box-shadow:.4cqmin .4cqmin 0 #000;color:#000}
.badge .dot{width:1.3cqmin;height:1.3cqmin;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent)}
h1{font-size:19cqmin;line-height:.85;font-weight:900;letter-spacing:-.045em;text-transform:uppercase;color:transparent;background:linear-gradient(180deg,#fff 0%,#d0d0f0 45%,#8a8ad0 50%,#c0c0e0 55%,#4a4a8a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.5cqmin var(--ink);filter:drop-shadow(.4cqmin .4cqmin 0 #ff2a68) drop-shadow(.8cqmin .8cqmin 0 var(--ink))}
h1 em{font-style:italic;color:transparent;background:linear-gradient(180deg,#fff 0%,#ffb0d8 50%,#ff2a68 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.4cqmin var(--ink);display:inline-block;transform:rotate(-2deg)}
.star-burst{position:absolute;top:18cqmin;left:3cqmin;width:12cqmin;height:12cqmin;background:var(--lime);border:.3cqmin solid var(--ink);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);display:flex;align-items:center;justify-content:center;font-size:1.5cqmin;font-weight:900;color:var(--ink);line-height:1;text-align:center;text-transform:uppercase;transform:rotate(-10deg);box-shadow:.3cqmin .3cqmin 0 var(--ink)}
.chat-bubble{background:linear-gradient(180deg,#fff,#e0f0ff);padding:2cqmin 3cqmin;border:.3cqmin solid var(--ink);border-radius:4cqmin;font-size:2.4cqmin;font-weight:900;color:var(--ink);width:fit-content;max-width:70%;position:relative;letter-spacing:.01em;box-shadow:.5cqmin .5cqmin 0 var(--ink)}
.chat-bubble::after{content:"";position:absolute;left:4cqmin;bottom:-2.5cqmin;width:4cqmin;height:2.5cqmin;background:linear-gradient(180deg,#fff,#e0f0ff);border:.3cqmin solid var(--ink);border-top:none;border-right:none;clip-path:polygon(0 0,100% 0,100% 100%)}
.chat-bubble em{color:var(--accent);font-style:italic}
.foot{background:linear-gradient(180deg,#8888cc 0%,#4a4a8a 100%);padding:2cqmin 3cqmin;border-top:.3cqmin solid #1a1a4a;display:flex;justify-content:space-between;align-items:center;font-size:1.8cqmin;color:#fff;font-weight:700;letter-spacing:.05em;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.foot .handle{display:flex;align-items:center;gap:1cqmin}
.foot .bpx{display:flex;align-items:center;gap:.5cqmin;background:var(--lime);color:#000;padding:.5cqmin 1.2cqmin;border:.2cqmin solid #000;border-radius:100px;font-size:1.6cqmin;text-shadow:none}
</style></head><body>
<div class="winbar">
  <span class="ico"></span>
  <span class="title">ZineDesktop.exe — hot takes · V.2</span>
  <div class="btns"><span class="btn">_</span><span class="btn">□</span><span class="btn">✕</span></div>
</div>
<div class="main">
  <span class="sparkle s1">✦</span>
  <span class="sparkle s2">★</span>
  <span class="sparkle s3">✿</span>
  <span class="badge"><span class="dot"></span> !! LIVE NOW !! ep. 04</span>
  <h1>POV<br/>u're <em>still</em><br/>using<br/>comic sans<br/>in <em>2026</em>?</h1>
  <span class="star-burst">★<br/>HOT<br/>TAKE</span>
  <div class="chat-bubble">→ babe. stop. <em>i can fix u.</em></div>
</div>
<div class="foot">
  <span class="handle">📡 @cybergal.jpg</span>
  <span class="bpx">◈ BOOKMARK THIS</span>
  <span>📼 vid 03/12</span>
</div>
</body></html>
