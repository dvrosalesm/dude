<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#ec4899;--ink:#fff;--dark:#422006;--accent:#fde047;--blue:#3b82f6;--green:#10b981;
  font-family:'Poppins','Nunito',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:6cqmin;gap:3cqmin;position:relative;
  background-image:radial-gradient(circle at 15% 30%,rgba(253,224,71,.3),transparent 40%),radial-gradient(circle at 85% 70%,rgba(59,130,246,.3),transparent 40%);
}
.sticker{position:absolute;background:var(--accent);color:var(--dark);border:.4cqmin solid var(--dark);border-radius:100%;padding:2cqmin 2.5cqmin;font-weight:800;font-size:1.4cqmin;text-align:center;line-height:1;box-shadow:.6cqmin .6cqmin 0 var(--dark)}
.sticker.top{top:6cqmin;right:8cqmin;transform:rotate(12deg)}
.sticker.bot{bottom:7cqmin;left:7cqmin;transform:rotate(-10deg);background:var(--green);color:#fff}
.sticker small{display:block;font-size:1cqmin;font-weight:600;margin-top:.2cqmin;opacity:.7}
.quote-mark{font-family:'Nunito',serif;font-size:20cqmin;font-weight:900;line-height:.7;color:var(--accent);text-shadow:.4cqmin .4cqmin 0 var(--dark);margin-bottom:-2cqmin}
blockquote{font-size:5.5cqmin;line-height:1.15;font-weight:800;letter-spacing:-.02em;max-width:24ch;text-align:center;color:#fff}
blockquote em{font-style:normal;background:var(--accent);color:var(--dark);padding:0 1cqmin;border-radius:1cqmin;box-shadow:.4cqmin .4cqmin 0 var(--dark);display:inline-block;transform:rotate(-2deg)}
blockquote .wavy{text-decoration:wavy underline var(--accent);text-decoration-thickness:.4cqmin;text-underline-offset:1cqmin}
.cite{display:flex;align-items:center;gap:2cqmin;padding:1.5cqmin 2.5cqmin;background:#fff;color:var(--dark);border-radius:100px;border:.4cqmin solid var(--dark);box-shadow:.6cqmin .6cqmin 0 var(--dark);font-size:1.5cqmin;margin-top:2cqmin}
.cite .avatar{width:4cqmin;height:4cqmin;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.8cqmin;border:.3cqmin solid var(--dark)}
.cite strong{font-weight:800;font-size:1.8cqmin}
.cite .role{font-family:'Caveat',cursive;font-size:1.8cqmin;color:var(--bg)}
</style></head><body>
<div class="sticker top">100%<small>real<br/>testimonial</small></div>
<div class="sticker bot">no ads<small>harmed in<br/>the making</small></div>
<div class="quote-mark">"</div>
<blockquote>Your product is like <em>finding the one pen</em> in the office that actually <span class="wavy">works.</span></blockquote>
<div class="cite">
  <div class="avatar">MO</div>
  <div><strong>Maya Okafor</strong> · <span class="role">design lead @ Pinwheel</span></div>
</div>
</body></html>
