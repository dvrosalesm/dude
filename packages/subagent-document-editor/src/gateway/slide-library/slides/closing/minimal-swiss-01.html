<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#f5f5f2;--ink:#0a0a0a;--muted:#6b6b6b;--rule:#111;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:5cqmin 7cqmin;
}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:2cqmin;font-size:1.3cqmin;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.main{display:flex;flex-direction:column;justify-content:flex-end;gap:3cqmin}
.big{font-size:11cqmin;line-height:.9;font-weight:500;letter-spacing:-.04em}
.big em{font-style:italic;font-weight:400}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqmin;padding-top:3cqmin;border-top:1px solid var(--rule);margin-top:2cqmin}
.info dl dt{font-size:1.3cqmin;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:.6cqmin}
.info dl dd{font-size:1.8cqmin;line-height:1.4}
footer{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--rule);padding-top:1.8cqmin;font-size:1.3cqmin;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
</style></head><body>
<header><span>End of deck</span><span>— ·</span><span>Thank you</span></header>
<div class="main">
  <div class="big">Thank you.<br/><em>Questions welcome.</em></div>
  <div class="info">
    <dl><dt>Email</dt><dd>team@example.co</dd></dl>
    <dl><dt>Schedule</dt><dd>cal.com/example/review</dd></dl>
    <dl><dt>Deck</dt><dd>example.co/q1-2026</dd></dl>
  </div>
</div>
<footer><span>Prepared by Strategy & Operations</span><span>042 / 042</span></footer>
</body></html>
