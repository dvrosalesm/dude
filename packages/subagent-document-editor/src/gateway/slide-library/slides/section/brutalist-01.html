<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#000;--ink:#fff;--yellow:#ffea00;--red:#ff2d2d;
  font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-columns:25cqmin 1fr;
  padding:0;
}
.rail{background:var(--yellow);color:var(--bg);padding:4cqmin 3cqmin;display:flex;flex-direction:column;justify-content:space-between;border-right:1cqmin solid var(--ink);position:relative;overflow:hidden}
.rail::before{content:"";position:absolute;top:0;right:-.5cqmin;bottom:0;width:1cqmin;background:repeating-linear-gradient(180deg,var(--bg) 0,var(--bg) 1cqmin,transparent 1cqmin,transparent 2cqmin)}
.num{font-size:35cqmin;line-height:.75;font-weight:900;letter-spacing:-.1em}
.label{font-size:1.6cqmin;letter-spacing:.3em;text-transform:uppercase;font-weight:900}
.label.rot{transform:rotate(-90deg) translateX(10cqmin);transform-origin:0 0;position:absolute;bottom:8cqmin;left:3cqmin;white-space:nowrap}
.main{padding:4cqmin 5cqmin;display:flex;flex-direction:column;justify-content:center;gap:3cqmin;position:relative;overflow:hidden}
.main::after{content:"";position:absolute;top:0;left:0;right:0;height:.4cqmin;background:var(--red)}
.main::before{content:"";position:absolute;bottom:0;left:0;right:0;height:.4cqmin;background:var(--yellow)}
.kicker{font-size:1.5cqmin;letter-spacing:.35em;text-transform:uppercase;color:var(--yellow);font-weight:900}
.kicker::before{content:"★ "}
.kicker::after{content:" ★"}
h2{font-size:17cqmin;line-height:.85;font-weight:900;letter-spacing:-.05em;text-transform:uppercase}
h2 .y{color:var(--yellow)}
h2 .r{color:var(--red);text-decoration:underline var(--yellow);text-decoration-thickness:1cqmin;text-underline-offset:1.5cqmin}
h2 .rot{display:inline-block;transform:rotate(-3deg);background:var(--red);color:var(--ink);padding:0 1cqmin;border:.3cqmin solid var(--ink)}
.hr{display:grid;grid-template-columns:repeat(40,1fr);gap:0;height:1cqmin}
.hr div{background:var(--ink);border-right:.2cqmin solid var(--bg)}
.hr div:nth-child(odd){background:var(--yellow)}
.hr div:nth-child(3n){background:var(--red)}
.hr div:nth-child(5n){background:var(--ink)}
.deck{font-size:2.4cqmin;letter-spacing:.05em;text-transform:uppercase;max-width:55ch;font-weight:900;line-height:1.3}
.deck em{font-style:normal;background:var(--yellow);color:var(--bg);padding:0 .4cqmin}
</style></head><body>
<div class="rail">
  <div>
    <div class="label">CHAPTER</div>
    <div class="num">III</div>
  </div>
  <div class="label">→ DANGER ZONE</div>
</div>
<div class="main">
  <span class="kicker">PART THREE · THE GOOD PART</span>
  <h2><span class="y">STOP</span><br/>ASKING<br/><span class="r">PERMISSION.</span><br/><span class="rot">SHIP IT.</span></h2>
  <div class="hr">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
  <p class="deck">WE FOUND OUT WHAT HAPPENS WHEN YOU STOP LISTENING TO THE COMMITTEE AND JUST <em>BUILD THE THING.</em> → CHAPTER THREE.</p>
</div>
</body></html>
