<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#0a0a0a;--ink:#fafafa;--muted:#888;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-columns:1fr 2fr;
}
.left{display:flex;flex-direction:column;justify-content:space-between;padding:6cqmin 5cqmin;border-right:1px solid #222}
.left .chapter{font-size:1.3cqmin;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.left .num{font-size:22cqmin;line-height:.8;font-weight:300;letter-spacing:-.05em}
.left .tag{font-size:1.3cqmin;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.right{display:flex;flex-direction:column;justify-content:flex-end;padding:6cqmin 7cqmin;gap:4cqmin}
h2{font-size:9cqmin;line-height:1;font-weight:400;letter-spacing:-.03em}
p{font-size:2cqmin;line-height:1.5;max-width:32ch;color:#d4d4d4}
.hr{width:8cqmin;height:1px;background:var(--ink)}
</style></head><body>
<div class="left">
  <span class="chapter">Part Two</span>
  <span class="num">02</span>
  <span class="tag">Operations</span>
</div>
<div class="right">
  <div class="hr"></div>
  <h2>Where the<br/>machinery lives.</h2>
  <p>A closer read on the systems, the teams behind them, and the decisions that quietly shaped our quarter.</p>
</div>
</body></html>
