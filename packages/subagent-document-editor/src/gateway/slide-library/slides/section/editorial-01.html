<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  --bg:#1a1410;--ink:#f2eee7;--muted:#c4b9a9;--rule:#4a3c2e;--accent:#c4944b;
  font-family:'Georgia','Times New Roman',serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overflow:hidden;
  container-type:size;
  display:grid;grid-template-rows:1fr auto;
  padding:5cqmin 6cqmin;
  background-image:radial-gradient(ellipse at 20% 30%,rgba(196,148,75,.06),transparent 55%);
}
.main{display:flex;flex-direction:column;justify-content:center;gap:3cqmin;max-width:75%}
.kicker{font-family:'Helvetica Neue',sans-serif;font-size:1.3cqmin;letter-spacing:.4em;text-transform:uppercase;color:var(--accent)}
.num{font-size:4cqmin;font-style:italic;color:var(--accent);font-weight:400}
h2{font-size:11cqmin;line-height:.95;font-weight:400;letter-spacing:-.02em}
h2 em{font-style:italic;color:var(--accent)}
.deck{font-size:2.2cqmin;font-style:italic;line-height:1.55;color:var(--muted);max-width:45ch;margin-top:1cqmin}
.foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding-top:2cqmin;font-family:'Helvetica Neue',sans-serif;font-size:1.2cqmin;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.ornament{font-size:2cqmin;color:var(--accent);letter-spacing:.5em}
</style></head><body>
<div class="main">
  <div class="kicker">Part II · Chapter Six</div>
  <div class="num">§ 06</div>
  <h2>On the <em>long view.</em></h2>
  <p class="deck">Why our best decisions this year were the ones that looked, at the time, like doing nothing at all.</p>
</div>
<div class="foot"><span>Editorial Division</span><span class="ornament">※ ※ ※</span><span>p. 23</span></div>
</body></html>
